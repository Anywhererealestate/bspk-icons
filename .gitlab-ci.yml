default:
    image: node:20
    before_script:
        - npm ci --cache .npm --prefer-offline
    cache:
        key: ${CI_COMMIT_REF_SLUG}
        paths:
            - .npm/

workflow:
    rules:
        - if: $CI_COMMIT_BRANCH

variables:
    NPM_TOKEN: ${CI_JOB_TOKEN}

stages:
    - release

publish:
    stage: release
    script:
        - npm run build
        - npm run semantic-release
    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
